# =============================================================================
# .gitlab-ci.yml — USSC Calendar CI/CD
#
# Stages:
#   build   — compile; two parallel jobs:
#               build      : standard flags  → binary artifact
#               analyze    : -Wextra/-Wshadow → warning report (allow_failure)
#   package — strip + SHA-256 tarball; main branch and version tags only
#
# Runner requirements (tilt-runner — shell executor, RHEL 9):
#   wxGTK-devel >= 3.2   (already installed system-wide)
#   gcc >= 11, make, git, strip (binutils)
# =============================================================================

stages:
  - build
  - package

# ── Shared defaults ──────────────────────────────────────────────────────────

default:
  tags: [tilt-runner]

variables:
  GIT_STRATEGY:    fetch
  GIT_CLEAN_FLAGS: -ffdx --exclude=obj/   # keep obj/ between retries for speed
  BINARY:          bin/ussc_calendar

# ── 1a. Standard build ────────────────────────────────────────────────────────

build:
  stage: build
  before_script:
    - echo "wxWidgets $(wx-config --version)  gcc $(gcc --version | head -1)"
    - echo "Commit ${CI_COMMIT_SHORT_SHA}  branch ${CI_COMMIT_BRANCH:-<detached>}"
  script:
    - make clean
    - make 2>&1 | tee build.log
    - |
      # Fail explicitly on any 'error:' line in the log
      if grep -qE '^\S+:[0-9]+:[0-9]+: error:' build.log; then
        echo "── Compilation errors ──────────────────────────────────────"
        grep -E '^\S+:[0-9]+:[0-9]+: error:' build.log
        exit 1
      fi
    - file ${BINARY}
    - ldd  ${BINARY}
    - |
      WARNS=$(grep -c 'warning:' build.log || true)
      echo "Build clean — ${WARNS} warning(s)"
  artifacts:
    name: "ussc_calendar-build-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/ussc_calendar
      - build.log
    expire_in: 1 week

# ── 1b. Extended static-analysis pass ────────────────────────────────────────
#
# Re-compiles with -Wextra -Wshadow -Wnull-dereference -fanalyzer.
# Produces a warning report; non-zero warning count is informational only
# (allow_failure: true) — pipeline still goes green.  Errors remain fatal.

analyze:
  stage: build
  script:
    - make clean
    - |
      make CXXFLAGS_EXTRA="-Wextra -Wshadow -Wnull-dereference \
                            -Wno-unused-parameter -fanalyzer" \
           2>&1 | tee analyze.log
    - |
      if grep -qE '^\S+:[0-9]+:[0-9]+: error:' analyze.log; then
        echo "── Errors found in analyze pass ────────────────────────────"
        grep -E '^\S+:[0-9]+:[0-9]+: error:' analyze.log
        exit 1
      fi
    - |
      WARNS=$(grep -c 'warning:' analyze.log || true)
      echo "── Analysis complete: ${WARNS} warning(s) ──────────────────"
      if [ "${WARNS}" -gt 0 ]; then
        echo "Top warnings:"
        grep 'warning:' analyze.log | sort | uniq -c | sort -rn | head -20
      fi
  artifacts:
    name: "ussc_calendar-analyze-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - analyze.log
    expire_in: 2 weeks
  allow_failure: true

# ── 2. Package ────────────────────────────────────────────────────────────────
#
# Strips the binary, bundles it into a versioned tarball with a SHA-256
# checksum file.  Only runs on the main branch and version tags (v*).

package:
  stage: package
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/
  script:
    - |
      # Resolve version: prefer tag, fall back to git-describe, fall back to sha
      if [ -n "${CI_COMMIT_TAG}" ]; then
        VERSION="${CI_COMMIT_TAG}"
      else
        VERSION=$(git describe --tags --always 2>/dev/null || echo "dev-${CI_COMMIT_SHORT_SHA}")
      fi
      echo "Packaging version ${VERSION}"
    - strip ${BINARY}
    - mkdir -p dist
    - |
      ARCHIVE="dist/ussc_calendar-${VERSION}-linux-x86_64.tar.gz"
      tar -czf "${ARCHIVE}" -C bin ussc_calendar
      sha256sum "${ARCHIVE}" | tee dist/SHA256SUMS
      echo "── Archive ──────────────────────────────────────────────────"
      ls -lh dist/
  artifacts:
    name: "ussc_calendar-${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}-pkg"
    paths:
      - dist/
    expire_in: 12 weeks
